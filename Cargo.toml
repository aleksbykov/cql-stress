[package]
edition = "2021"
name = "cql-stress"
version = "0.2.4"
rust-version = "1.89.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "cql-stress-cassandra-stress"
path = "src/bin/cql-stress-cassandra-stress/main.rs"

[[bin]]
name = "cql-stress-scylla-bench"
path = "src/bin/cql-stress-scylla-bench/main.rs"

[profile.release]
codegen-units = 1
panic = "abort"

[profile.dist]
inherits = "release"
lto = true
opt-level = 3
overflow-checks = false
debug = false
strip = true
debug-assertions = false

[profile.dev-opt]
inherits = "dev"
opt-level = 2

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22"
chrono = "0.4.44"
futures = "0.3.32"
hdrhistogram = "7.5.4"
lazy_static = "1.5.0"
java_random = "0.1.7"
openssl = "0.10.80"
parking_lot = "0.12.5"
rand = "0.10"
rand_distr = "0.6"
rand_pcg = "0.10"
regex = "1.12.3"
scylla = { version = "1.7.0", features = [
    "openssl-010",
    "unstable-strong-consistency",
] }
sha2 = "0.11"
strum = "0.28.0"
strum_macros = "0.28.0"
thread_local = "1.1.9"
# NOTE: tokio pinning removed - regression in https://github.com/tokio-rs/tokio/issues/7744 has been resolved
tokio = { version = "1.52.3", features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "fs",
    "signal",
] }
tokio-timerfd = { version = "0.2.0", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rust-strictmath = "0.1.2"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_yaml = { version = "0.9", optional = true }
# Not optional: coordinator accounting identifies nodes by `Node::host_id`, which is a
# `uuid::Uuid`, and that is unconditional. Unifies with the driver's own uuid dependency.
uuid = "1.23"

[build-dependencies]
reqwest = { version = "0.13", features = ["json", "blocking"] }
serde_json = "1.0"
chrono = "0.4.44"
cargo-lock = "11.0.1"
git2 = "0.21"

[features]
default = ["user-profile"]
user-profile = ["dep:serde", "dep:serde_yaml"]
timerfd = ["dep:tokio-timerfd"]

[dev-dependencies]
ntest = "0.9"
num-bigint = "0.4"
bigdecimal = "0.4"
scylla = { version = "1.7.0", features = [
    "openssl-010",
    "num-bigint-04",
    "bigdecimal-04",
    "unstable-strong-consistency",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fetch_extended_version_info)',
] }

# Build against scylla-rust-driver #1788 (leader-aware TABLETS_ROUTING_V2 routing), which is
# required to benchmark strongly consistent (Raft-per-tablet) tables: the server places the
# tablet's Raft leader first in the V2 replica list and `DefaultPolicy` routes there
# deterministically. Negotiation is automatic - there is no client-side opt-in.
#
# NOTE: #1788 is MERGED (upstream `cf24aa05`, 2026-09-02) but not in any release - v1.8.0 was
# tagged 2026-08-13, before it. The rev below is upstream `main`, chosen over the merge commit
# because two follow-ups this build depends on landed after it: `52a857b4` dropped
# `ConsistencyMode::Local` and `c71ee8c2` (#1887) re-exposed `ConsistencyMode` and
# `Keyspace::consistency_mode` behind the `unstable-strong-consistency` feature. A release is
# expected imminently; when it lands, delete this whole section and move the requirement above
# to it.
#
# The patched crate declares version 1.8.0, which the `scylla = "1.7.0"` requirement above
# accepts. Note that 1.8.0 is *released* and does NOT contain #1788, so dropping this patch
# without bumping the requirement would resolve to a driver with no leader-aware routing at
# all. That mistake cannot pass silently: the `unstable-strong-consistency` feature does not
# exist in 1.8.0, so cargo fails to resolve rather than building something that benchmarks the
# wrong thing.
[patch.crates-io]
scylla = { git = "https://github.com/scylladb/scylla-rust-driver", rev = "ddfaed63edca1c10b2d79230830a60016a53fd91" }
